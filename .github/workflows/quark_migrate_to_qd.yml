name: Quark encrypted transfer to QD
run-name: Quark encrypted transfer e622e05f4fb041bc8a9cb6225d1bcf3e

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quark-encrypted-transfer-e622e05f4fb041bc8a9cb6225d1bcf3e
  cancel-in-progress: false

jobs:
  encrypt:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install pinned encryption library
        run: python3 -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Encrypt existing secret with the local public key
        env:
          QUARK_SOURCE: ${{ secrets.COOKIE_QUARK }}
          TRANSFER_REPOSITORY: ${{ github.repository }}
          TRANSFER_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          
          PUBLIC_PEM = '-----BEGIN PUBLIC KEY-----\nMIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAqJlHNHZl2BLaPwLdFZMH\nZNbiXuVW8hpRSUIcHh0Jm0y3YwmzJvfUeLsG1Ig0gj9jARRR+HADpue9ZZdZY+o1\nDC7DTLjpT5M7uMkwxRDPijPWHCFku2TQZqsvgjrU+OpjvpYWkvYLEJl5GPtx2kMv\nSlL3vN0qkykX74Gv0a2OC+H/8tHmwlJqEsxU99RmD55vq9P2abq7uz5Dre6zL+Nc\ncEGoC8xYwRcUm8JtGhvy86lHoVnWSjKkwAD0iP4ZKy05ZOKLXyV4+l+8i89bSkQv\nQoj1riHtPNNVSyI9mv0rdxwfgvHRQZopXh/9CxTY78xvDCsO/cD3vrTVQzCleXsY\n6rDCoaWMhBJomkk3ELKuEKLm29gJM0i6lFBi9rZn8NvVvWdPGM/4D2eYs0iU1C9/\nBGGXrl4dCaF8RCvNem1giAP5h3DWhUgFt3Ds8j89wIr7PnHrzFu0Pb1PtDgkSe3y\nMJq5F/9alVfKuDzFYDwFcO064znNwDfk/gGMlQrSQbBkN3DlN2xckX9xudxFM4bt\nj4hUlDKUR91ZaQHYNtyhbuAQPzaa9B6eUv9otcaIGFNOIbLmTu8zHoCoUuZYXiXR\nhXn3AwjW8s4/Uzm3sepC3RMZwnDWn8FRe3Jd0hw6zwDtO8UiYb8JDYByeQhi+7+o\nexxJzIGBrEIoMWMYPlcewW0CAwEAAQ==\n-----END PUBLIC KEY-----\n'
          EXPECTED_REPOSITORY = 'hunter8605/Quark_Auot_Check_In'
          MIGRATION_ID = 'e622e05f4fb041bc8a9cb6225d1bcf3e'
          
          def main():
              secret = os.environ.pop("QUARK_SOURCE", "").encode("utf-8")
              if not secret or len(secret) > 131072:
                  raise SystemExit("Source secret is missing or exceeds the transfer size limit")
              repository = os.environ["TRANSFER_REPOSITORY"]
              run_id = os.environ["TRANSFER_RUN_ID"]
              if repository != EXPECTED_REPOSITORY or not run_id.isdecimal():
                  raise SystemExit("Transfer context mismatch")
              public = serialization.load_pem_public_key(PUBLIC_PEM.encode("ascii"))
              fingerprint = hashlib.sha256(public.public_bytes(
                  serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo
              )).hexdigest()
              metadata = {
                  "version": 1, "algorithm": "RSA-OAEP-SHA256+AES-256-GCM",
                  "repository": repository, "migration_id": MIGRATION_ID,
                  "run_id": run_id, "public_key_sha256": fingerprint,
              }
              aad = json.dumps(metadata, sort_keys=True, separators=(",", ":")).encode("ascii")
              key = AESGCM.generate_key(bit_length=256)
              nonce = os.urandom(12)
              ciphertext = AESGCM(key).encrypt(nonce, secret, aad)
              wrapped = public.encrypt(key, padding.OAEP(
                  mgf=padding.MGF1(algorithm=hashes.SHA256()),
                  algorithm=hashes.SHA256(), label=b"quark-qd-transfer-v1"
              ))
              envelope = {"metadata": metadata, "wrapped_key": base64.b64encode(wrapped).decode("ascii"),
                          "nonce": base64.b64encode(nonce).decode("ascii"),
                          "ciphertext": base64.b64encode(ciphertext).decode("ascii")}
              directory = Path("quark-transfer")
              directory.mkdir(mode=0o700, exist_ok=False)
              target = directory / "quark-transfer.json.enc"
              target.write_text(json.dumps(envelope, sort_keys=True), encoding="utf-8")
              target.chmod(0o600)
              print("Encrypted transfer package prepared; plaintext was not saved")
          
          if __name__ == "__main__":
              main()
          PY
      - name: Upload encrypted package only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quark-transfer-e622e05f4fb041bc8a9cb6225d1bcf3e
          path: quark-transfer/quark-transfer.json.enc
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
